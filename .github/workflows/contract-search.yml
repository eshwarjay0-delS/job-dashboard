name: Contract board search regression

on:
  pull_request:
    paths:
      - "src/lib/contract-search.ts"
      - "src/app/dashboard/contracts/page.tsx"
      - "scripts/tests/contract-search.test.mjs"
      - "package.json"
      - "scripts/tests/kompas-deploy-build.test.mjs"
      - ".github/workflows/contract-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test scripts/tests/contract-search.test.mjs
