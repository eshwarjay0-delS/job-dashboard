name: WhatsApp resume recovery regression
on:
  push:
    branches: [master]
    paths:
      - 'src/lib/tailor.ts'
      - 'src/lib/resume-quality.ts'
      - 'src/lib/whatsapp-resume-acceptance.ts'
      - 'src/lib/whatsapp-resume-recovery.ts'
      - 'src/lib/whatsapp-retry-policy.ts'
      - 'src/app/api/whatsapp/**'
      - 'scripts/tests/whatsapp-resume-recovery.test.mjs'
      - '.github/workflows/whatsapp-resume-regression.yml'
  pull_request:
    paths:
      - 'src/lib/tailor.ts'
      - 'src/lib/resume-quality.ts'
      - 'src/lib/whatsapp-resume-acceptance.ts'
      - 'src/lib/whatsapp-resume-recovery.ts'
      - 'src/lib/whatsapp-retry-policy.ts'
      - 'src/app/api/whatsapp/**'
      - 'scripts/tests/whatsapp-resume-recovery.test.mjs'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/tests/whatsapp-resume-recovery.test.mjs
