name: Crawler freshness regression

on:
  pull_request:
    paths:
      - "src/lib/crawl/search.ts"
      - "src/app/api/crawl/jobs/route.ts"
      - "src/lib/crawl/adapters.ts"
      - "src/lib/vendorPortals.ts"
      - "scripts/tests/crawl-freshness.test.mjs"
      - ".github/workflows/crawl-freshness.yml"
  push:
    branches:
      - "fix/crawl-freshness-eteam-20261109"
    paths:
      - "src/lib/crawl/search.ts"
      - "src/app/api/crawl/jobs/route.ts"
      - "src/lib/crawl/adapters.ts"
      - "src/lib/vendorPortals.ts"
      - "scripts/tests/crawl-freshness.test.mjs"
      - ".github/workflows/crawl-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawler-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run crawler freshness regressions
        run: node --experimental-strip-types --test scripts/tests/crawl-freshness.test.mjs
