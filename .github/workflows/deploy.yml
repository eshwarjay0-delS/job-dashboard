name: CD — Verify Vercel Git Deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: vercel-git-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    name: Verify exact-commit Vercel deployment status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install baseline dependencies
        run: npm ci
      - name: Kompas baseline contract
        run: node scripts/kompas-baseline.mjs
      - name: Verify Vercel Git deployment on this exact commit
        run: node scripts/verify-vercel-git-status.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Clarify verification boundary
        run: echo "GitHub's exact-commit Vercel success status observed. Production domain/alias and real Kompas answer acceptance require separate verification."
