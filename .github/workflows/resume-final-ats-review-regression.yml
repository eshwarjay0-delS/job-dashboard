name: Resume final DOCX ATS review regression

on:
  push:
    branches:
      - feat/final-docx-gemini-ats-review-20261110
    paths:
      - "src/lib/tailor.ts"
      - "src/lib/claude.ts"
      - "src/lib/resume-final-ats-review.ts"
      - "scripts/tests/resume-final-ats-review.test.mjs"
      - "scripts/tests/resume-final-ats-loop.test.mjs"
      - ".github/workflows/resume-final-ats-review-regression.yml"
  pull_request:
    paths:
      - "src/lib/tailor.ts"
      - "src/lib/claude.ts"
      - "src/lib/resume-final-ats-review.ts"
      - "scripts/tests/resume-final-ats-review.test.mjs"
      - "scripts/tests/resume-final-ats-loop.test.mjs"
      - ".github/workflows/resume-final-ats-review-regression.yml"

permissions:
  contents: read

jobs:
  final-docx-ats:
    name: final DOCX ATS review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Final DOCX ATS review tests
        run: node --no-warnings --experimental-strip-types --test scripts/tests/resume-final-ats-review.test.mjs scripts/tests/resume-final-ats-loop.test.mjs
