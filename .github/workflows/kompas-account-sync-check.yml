name: Kompas cross-device account synchronization gate
on:
  pull_request:
    branches: [master]
    paths:
      - "public/kompas/account-sync.js"
      - "public/kompas/app.js"
      - "public/kompas/index.html"
      - "scripts/tests/kompas-account-sync.test.mjs"
      - "src/app/api/kompas/account-sessions/**"
      - "src/app/api/kompas/account-artifacts/**"
      - "supabase/migrations/20261030*kompas*"
      - ".github/workflows/kompas-account-sync-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-account-session-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate browser code and cross-device regressions
        run: |
          node --check public/kompas/account-sync.js
          node --check public/kompas/app.js
          node --test scripts/tests/kompas-account-sync.test.mjs scripts/tests/kompas-desktop-ticket.test.mjs
