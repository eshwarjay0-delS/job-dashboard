name: CI â€” Lint Â· Type-check Â· Build Â· Audit

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: "22"

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: false

      - name: Verify one-click Caption Capture and 50-fold question/spelling regression
        run: |
          node --check public/kompas/caption-once.js
          node --check public/kompas/app.js
          node --check legacy/perfact/desktop/main.js
          node --check legacy/perfact/desktop/preload.js
          node --check legacy/perfact/desktop/marketfit-auth.cjs
          node --check public/kompas/session-reauth.js
          node --test legacy/perfact/desktop/scripts/marketfit-auth.test.cjs
          node --test scripts/tests/kompas-session-reauth.test.mjs scripts/tests/auth-disabled-session-start.test.mjs scripts/tests/desktop-session-family.test.mjs
