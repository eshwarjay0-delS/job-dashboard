name: CI — Lint · Type-check · Build · Audit

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: "22"

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: false

      - name: Verify cross-domain and interview question fidelity
        run: node --test scripts/tests/kompas-interview-precision.test.mjs scripts/tests/kompas-shape-calibration.test.mjs scripts/tests/kompas-50fold-relevance.test.mjs scripts/tests/kompas-crossdomain-50.test.mjs scripts/tests/kompas-crossdomain-live-fixture.test.mjs scripts/tests/kompas-paired-review.test.mjs scripts/tests/kompas-score-review.test.mjs scripts/tests/kompas-review-template.test.mjs scripts/tests/kompas-relevance-review.test.mjs scripts/tests/kompas-relevance-recovery.test.mjs scripts/tests/kompas-chief-kernel-54fold.test.mjs

      - name: Verify grounded spoken streaming and original-source claims
        run: node --test scripts/tests/kompas-safe-spoken-stream.test.mjs scripts/tests/kompas-deploy-build.test.mjs

      - name: Verify Kompas migration asset closure and lossless import
        run: node --experimental-strip-types --test scripts/tests/kompas-migration-assets.test.mjs scripts/tests/kompas-review-parity.test.mjs scripts/tests/kompas-blend-harvest.test.mjs scripts/tests/kompas-three-levels.test.mjs scripts/tests/kompas-desktop-three-levels.test.mjs scripts/tests/kompas-blend.test.mjs scripts/tests/kompas-session-recap.test.mjs scripts/tests/kompas-grounding-route.test.mjs

      - name: Verify desktop Screen Answer UI and capture path
        run: node --check public/kompas/app.js && node --test scripts/tests/kompas-desktop-screen-action.test.mjs scripts/tests/kompas-screen-response.test.mjs scripts/tests/kompas-screen-review.test.mjs

      - name: Verify slice 5d audio-watchdog hooks (levels, tracks, guarded restart; fake devices only)
        run: node --no-warnings --test scripts/tests/kompas-audio-watchdog-hooks.test.mjs
      - name: Verify WhatsApp Kompas channel and shared-session safety
        run: node --test scripts/tests/whatsapp-kompas*.test.mjs scripts/tests/kompas-shared-session.test.mjs scripts/tests/kompas-shared-turn.test.mjs

      - name: Verify WhatsApp voice notes, commands and low-overhead processing
        run: node --test scripts/tests/whatsapp-voice.test.mjs

      - name: Verify source-aware intake, typed follow-ups, mishearings and the speech provider switch
        run: node --experimental-strip-types --test scripts/tests/kompas-source-intake.test.mjs scripts/tests/kompas-stt-provider.test.mjs scripts/tests/kompas-dictation-accuracy.test.mjs

      - name: Verify slice 5a spelling parity (one repair list on the desktop and the server; normal English untouched)
        run: node --experimental-strip-types --test scripts/tests/kompas-spelling-parity.test.mjs

      - name: Verify the question cut with no punctuation, named follow-ups and opening questions (50 and 200 stress)
        run: node --experimental-strip-types --test scripts/tests/kompas-question-cut-slice2.test.mjs scripts/tests/kompas-question-replay.test.mjs

      - name: Verify who opens a question, bleed by spoken time, the turn gate and the guarded repairs (50 and 200 stress)
        run: node --experimental-strip-types --test scripts/tests/kompas-source-gate-v2.test.mjs

      - name: Verify slice 3 question cut (follow-ups, repeats, lists, tags, polite asks, audio checks, statements; 50 and 200 stress)
        run: node --experimental-strip-types --test scripts/tests/kompas-question-cut-slice3.test.mjs

      - name: Verify slice 4 question cut (unpunctuated runs, explain the X, SSH on both sides; 50 and 200 stress)
        run: node --experimental-strip-types --test scripts/tests/kompas-question-cut-slice4.test.mjs

      - name: Verify slice 5b blind dossier bank (191 real questions, 130 runs; punctuated, stripped, filler)
        run: node --experimental-strip-types --test scripts/tests/kompas-blind-bank.test.mjs

      - name: Verify slice 5c early-release decision (design reference, flag off; not wired into the page)
        run: node --test scripts/tests/kompas-early-release.test.mjs

      - name: Verify consented voice benchmark metrics
        run: node --test scripts/tests/kompas-voice-metrics.test.mjs

      - name: Verify bounded Kompas speech uploads and private benchmark CLI
        run: node --experimental-strip-types --test scripts/tests/kompas-audio-upload.test.mjs scripts/tests/kompas-voice-metrics-cli.test.mjs

      - name: Verify speech container MIME parity
        run: node --experimental-strip-types --test scripts/tests/kompas-audio-upload-mime.test.mjs

      - name: Verify Git-integrated Vercel deployment status handling
        run: node --test scripts/tests/verify-vercel-git-status.test.mjs

      - name: Verify MarketFit login visual story and media asset
        run: node --test scripts/tests/login-journey-animation.test.mjs scripts/tests/login-35s-story.test.mjs

      - name: Build (Webpack; retry only known intermittent Google-font URL bug)
        run: |
          # Next 16 occasionally receives a valid Google Fonts /l/font?kit URL
          # with no extension. Its loader then throws "reading '1'" in both
          # webpack and Turbopack. Retry only this known transient issue;
          # every other build error fails immediately, and retries are bounded.
          for attempt in 1 2 3 4; do
            set +e
            npm run build -- --webpack 2>&1 | tee /tmp/marketfit-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -q "Cannot read properties of null (reading '1')" /tmp/marketfit-build.log || ! grep -q 'next/font' /tmp/marketfit-build.log; then
              exit "$status"
            fi
            if [ "$attempt" -ge 4 ]; then exit "$status"; fi
            echo "::warning::Next.js received an extensionless Google Fonts URL; retrying safe Webpack build ($attempt/4)"
            rm -rf .next
            sleep "$((attempt * 2))"
          done
        env:
          # Stub vars so build doesn't crash on missing env
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_key' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-placeholder' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID || 'placeholder' }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY || 'placeholder' }}

      - name: Check bundle size
        run: |
          PAGES=$(du -sh .next/server/app 2>/dev/null || echo "N/A")
          STATIC=$(du -sh .next/static 2>/dev/null || echo "N/A")
          echo "📦 Server pages: $PAGES"
          echo "📦 Static assets: $STATIC"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1