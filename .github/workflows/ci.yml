name: CI — Lint · Type-check · Build · Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          # Stub vars so build doesn't crash on missing env
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_key' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-placeholder' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID || 'placeholder' }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY || 'placeholder' }}

      - name: Check bundle size
        run: |
          PAGES=$(du -sh .next/server/app 2>/dev/null || echo "N/A")
          STATIC=$(du -sh .next/static 2>/dev/null || echo "N/A")
          echo "📦 Server pages: $PAGES"
          echo "📦 Static assets: $STATIC"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
